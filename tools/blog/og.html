<!doctype html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist"; src: url("{root}/assets/fonts/geist-semibold.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Geist"; src: url("{root}/assets/fonts/geist-medium.woff2") format("woff2"); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(120% 90% at 0% 0%, rgba(44, 24, 72, 0.9) 0%, rgba(26, 16, 44, 0.5) 40%, transparent 72%),
      radial-gradient(60% 70% at 78% 30%, rgba(60, 36, 110, 0.45) 0%, transparent 70%),
      #0a0a0b;
    font-family: "Geist", sans-serif;
    color: #f5f2fb;
  }
  body::after { content: ""; position: absolute; inset: 0; background: url("{root}/assets/img/grain.png") 0 0 / 96px repeat; opacity: 0.9; }
  .beam { position: absolute; left: 640px; top: -60px; width: 560px; height: 720px; filter: blur(20px); }
  .beam::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(169, 139, 255, 0) 0%, rgba(169, 139, 255, 0.3) 14%, rgba(124, 92, 250, 0.06) 70%, transparent); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); }
  .copy { position: absolute; z-index: 2; left: 80px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 34px; letter-spacing: -0.03em; }
  .brand img { width: 46px; height: 46px; border-radius: 11px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14); }
  .kicker { margin-top: 44px; color: #a9a2b8; font-size: 22px; font-weight: 500; letter-spacing: 0.01em; display: flex; align-items: center; gap: 14px; }
  .kicker::before { content: ""; width: 36px; height: 9px; transform: rotate(-8deg); background: #a98bff; clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 50%, 100% 100%, 0 100%, 3px 50%); box-shadow: 0 0 14px #a98bff; }
  h1 { margin-top: 20px; font-size: 68px; font-weight: 600; line-height: 1.02; letter-spacing: -0.045em; text-wrap: balance; }
  h1 span { color: #cdbdff; }
  .phones { position: absolute; z-index: 1; right: 30px; top: 46px; width: 470px; height: 640px; }
  .phone { position: absolute; width: 238px; padding: 7px; border-radius: 36px; background: #050507; box-shadow: inset 0 0 0 1.5px #5c5868, inset 0 0 0 3px #1b1a20, 0 40px 80px -30px rgba(0, 0, 0, 0.9), 0 30px 90px -30px rgba(124, 92, 255, 0.55); }
  .phone img { display: block; width: 100%; aspect-ratio: 720 / 1564; object-fit: cover; border-radius: 29px; }
  .phone::after { content: ""; position: absolute; top: 12px; left: 50%; width: 68px; height: 20px; transform: translateX(-50%); border-radius: 999px; background: #000; }
  .p1 { left: 0; top: 56px; transform: rotate(-6deg); }
  .p1 img { filter: brightness(0.85); }
  .p2 { right: 10px; top: 0; transform: rotate(5deg); }
  .tape { position: absolute; z-index: 3; left: 650px; width: 520px; bottom: 54px; height: 20px; transform: rotate(-3deg); filter: drop-shadow(0 0 16px rgba(169, 139, 255, 0.6)); }
  .tape::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 55%), #a98bff; clip-path: polygon(4px 0, calc(100% - 3px) 0, calc(100% - 8px) 24%, calc(100% - 1px) 50%, calc(100% - 6px) 74%, 100% 100%, 3px 100%, 8px 76%, 0 52%, 6px 28%); }
</style>
</head>
<body>
  <div class="beam"></div>
  <div class="copy">
    <div class="brand"><img src="{root}/assets/img/app-icon.webp" alt="">Dancify</div>
    <p class="kicker">{kicker}</p>
    <h1>{heading}</h1>
  </div>
  <div class="phones">
    <div class="phone p1"><img src="{shot1}" alt=""></div>
    <div class="phone p2"><img src="{shot2}" alt=""></div>
  </div>
  <div class="tape"></div>
  <script>
    // Long headlines (German compounds) shrink until they fit beside the phones.
    const h1 = document.querySelector("h1");
    let size = 68;
    while (size > 40 && (h1.scrollHeight > 300 || h1.scrollWidth > h1.clientWidth)) h1.style.fontSize = `${(size -= 2)}px`;
  </script>
</body>
</html>
