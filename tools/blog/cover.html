<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2400px; height: 1200px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(90% 100% at 0% 0%, rgba(44, 24, 72, 0.85) 0%, rgba(26, 16, 44, 0.4) 45%, transparent 75%),
      radial-gradient(60% 80% at 100% 100%, rgba(30, 20, 50, 0.7) 0%, transparent 70%),
      #0a0a0b;
  }
  body::after { content: ""; position: absolute; inset: 0; z-index: 5; background: url("{root}/assets/img/grain.png") 0 0 / 120px repeat; opacity: 0.8; pointer-events: none; }
  :root { --tape: #a98bff; }
  .lavender { --tape: #a98bff; }
  .amber { --tape: #f7c873; }
  .green { --tape: #7ee3c1; }
  .pink { --tape: #f48fd0; }
  .blue { --tape: #8cc8ff; }
  .beam { position: absolute; left: 560px; top: -160px; width: 1280px; height: 1440px; filter: blur(36px); }
  .beam::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(169, 139, 255, 0) 0%, rgba(169, 139, 255, 0.32) 14%, rgba(124, 92, 250, 0.08) 65%, transparent); clip-path: polygon(36% 0, 64% 0, 100% 100%, 0 100%); }
  .floor { position: absolute; left: 50%; bottom: 40px; width: 1700px; height: 160px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(124, 92, 250, 0.22), rgba(124, 92, 250, 0)); }
  .device { position: absolute; padding: var(--bz); border-radius: calc(var(--w) * 0.148); background: #050507; box-shadow: inset 0 0 0 2.5px #5c5868, inset 0 0 0 5px #1b1a20, 0 80px 140px -50px rgba(0, 0, 0, 0.95), 0 60px 160px -60px rgba(124, 92, 255, 0.6); }
  .device img { display: block; width: 100%; height: auto; border-radius: calc(var(--w) * 0.148 - var(--bz)); }
  .device i { position: absolute; top: calc(var(--bz) + var(--w) * 0.034); left: 50%; width: 29%; height: calc(var(--w) * 0.08); transform: translateX(-50%); border-radius: 999px; background: #000; }
  .c { --w: 500px; --bz: 13px; left: 950px; top: 70px; width: var(--w); z-index: 2; }
  .l, .r { --w: 440px; --bz: 12px; top: 170px; width: var(--w); }
  .l { left: 470px; transform: rotate(-4deg); }
  .r { left: 1490px; transform: rotate(4deg); }
  .l img, .r img { filter: brightness(0.86); }
  .tape { position: absolute; z-index: 1; left: 300px; right: 300px; bottom: 120px; height: 38px; transform: rotate(-2.5deg); filter: drop-shadow(0 0 30px color-mix(in srgb, var(--tape) 60%, transparent)); }
  .tape::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, 0.08)), var(--tape); clip-path: polygon(8px 0, calc(100% - 5px) 0, calc(100% - 16px) 22%, calc(100% - 2px) 46%, calc(100% - 13px) 72%, 100% 100%, 5px 100%, 16px 78%, 0 54%, 12px 28%); }
</style>
</head>
<body class="{tape}">
  <div class="beam"></div>
  <span class="floor"></span>
  <div class="device l"><img src="{left}" alt=""><i></i></div>
  <div class="device c"><img src="{center}" alt=""><i></i></div>
  <div class="device r"><img src="{right}" alt=""><i></i></div>
  <div class="tape"></div>
</body>
</html>
