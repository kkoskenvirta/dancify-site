<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2400px; height: 1200px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(90% 100% at 0% 0%, rgba(72, 40, 122, 0.72), rgba(72, 40, 122, 0) 72%),
      radial-gradient(70% 70% at 62% 34%, rgba(62, 40, 120, 0.34), rgba(62, 40, 120, 0) 76%),
      linear-gradient(to bottom, #120f1b, #0a0a0b 72%);
  }
  body::after { content: ""; position: absolute; inset: 0; z-index: 5; background: url("{root}/assets/img/grain.png") 0 0 / 120px repeat; opacity: 0.8; pointer-events: none; }
  :root { --tape: #a98bff; }
  .beam { position: absolute; left: 560px; top: -160px; width: 1280px; height: 1440px; filter: blur(36px); }
  .beam::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(169, 139, 255, 0) 0%, rgba(169, 139, 255, 0.32) 14%, rgba(124, 92, 250, 0.08) 65%, transparent); clip-path: polygon(36% 0, 64% 0, 100% 100%, 0 100%); }
  .floor { position: absolute; left: 50%; bottom: 40px; width: 1700px; height: 160px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(124, 92, 250, 0.22), rgba(124, 92, 250, 0)); }
  .device { position: absolute; padding: var(--bz); border-radius: calc(var(--w) * 0.168); background: linear-gradient(140deg, #f5f4f9 0%, #c8c5d2 24%, #8f8ba0 52%, #d5d2de 74%, #7d798d 100%); box-shadow: 0 80px 140px -60px rgba(0, 0, 0, 0.95), 0 50px 160px -60px rgba(124, 92, 250, 0.55); }
  .device::before { content: ""; position: absolute; inset: calc(var(--w) * 0.011); border-radius: calc(var(--w) * 0.158); background: #040406; }
  .device img { position: relative; display: block; width: 100%; height: auto; border-radius: calc(var(--w) * 0.134); }
  .device i { position: absolute; top: calc(var(--bz) + var(--w) * 0.034); left: 50%; width: 29%; height: calc(var(--w) * 0.08); transform: translateX(-50%); border-radius: 999px; background: #000; }
  .c { --w: 500px; --bz: 17px; left: 950px; top: 70px; width: var(--w); z-index: 2; }
  .l, .r { --w: 440px; --bz: 15px; top: 170px; width: var(--w); }
  .l { left: 470px; transform: rotate(-4deg); }
  .r { left: 1490px; transform: rotate(4deg); }
  .tape { position: absolute; z-index: 1; left: 300px; right: 300px; bottom: 120px; height: 38px; transform: rotate(-2.5deg);  }
  .tape::before { content: ""; position: absolute; inset: 0; background: var(--tape); clip-path: polygon(8px 0, calc(100% - 5px) 0, calc(100% - 16px) 22%, calc(100% - 2px) 46%, calc(100% - 13px) 72%, 100% 100%, 5px 100%, 16px 78%, 0 54%, 12px 28%); }
</style>
</head>
<body class="{tape}">
  <div class="beam"></div>
  <span class="floor"></span>
  <div class="device l"><img src="{left}" alt=""><i></i></div>
  <div class="device c"><img src="{center}" alt=""><i></i></div>
  <div class="device r"><img src="{right}" alt=""><i></i></div>
  <div class="tape"></div>
</body>
</html>
